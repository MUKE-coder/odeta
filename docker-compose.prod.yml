services:
  # Single binary: Go API + embedded Next.js SPA
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odeta-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-grit}:${POSTGRES_PASSWORD}@postgres:5432/odeta?sslmode=disable
      REDIS_URL: redis://redis:6379
      PORT: "8080"
    volumes:
      - odeta-projects:/tmp/odeta-projects
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      # Force HTTP/1.1 for SSE streaming compatibility
      - "traefik.http.services.odeta-api.loadbalancer.server.scheme=h2c"
      - "traefik.http.middlewares.odeta-headers.headers.customresponseheaders.Connection=keep-alive"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - odeta

  postgres:
    image: postgres:16-alpine
    container_name: odeta-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: odeta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grit -d odeta"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - odeta

  redis:
    image: redis:7-alpine
    container_name: odeta-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - odeta

  # Builds the sandbox image (exits after build — expected)
  sandbox-builder:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.sandbox
    image: odeta-sandbox
    container_name: odeta-sandbox-builder
    command: "echo 'Sandbox image built successfully' && exit 0"
    restart: "no"

networks:
  odeta:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  odeta-projects:
